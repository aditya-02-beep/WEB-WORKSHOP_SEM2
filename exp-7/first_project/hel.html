<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Number Pattern Generator</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
            background: #f4f4f4;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
        }
        #output {
            margin-top: 20px;
            font-size: 20px;
            white-space: pre;
            background: white;
            display: inline-block;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h2>Number Pattern Generator</h2>

    <input type="number" id="num" placeholder="Enter a number">
    <br>
    <button onclick="generatePattern()">Generate Pattern</button>

    <div id="output"></div>

    <script>
        function generatePattern() {
            let n = document.getElementById("num").value;
            let pattern = "";

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= i; j++) {
                    pattern += j + " ";
                }
                pattern += "\n";
            }

            document.getElementById("output").innerText = pattern;
        }
    </script>

</body>
</html>
